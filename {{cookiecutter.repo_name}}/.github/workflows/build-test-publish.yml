# Build, test and publish this package.
#
# The whole file is wrapped in a Jinja raw block by the cookiecutter template
# that generated it, so GitHub's own ${{ ... }} expressions survive rendering.
# Nothing here needs editing for that reason.
#
# Releases are tag-driven: push a tag matching the version in version.txt (for
# example `v0.1.0`) and the publish jobs run. Ordinary pushes and pull requests
# only lint, test and build -- publishing is irreversible, so it never happens
# by accident.
name: Build, Test, Publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the previous run instead of
# queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, format and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # pre-commit builds an isolated environment per hook repo. Caching them
      # keyed on the config turns a multi-minute cold start into seconds.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: bash run.sh lint:ci

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.11"; the matrix covers
        # every supported minor version up to the newest.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: make install
      - run: make test
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: test-reports/
          if-no-files-found: ignore

  build:
    name: Build wheel and sdist
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm-style tooling and `git describe` need full history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build
      - run: make build
      # Test the built artifact, not the working tree. This is the step that
      # catches a module missing from the wheel -- `make test` never will,
      # because it imports from an editable install.
      - name: Test the built wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install --upgrade pip
          /tmp/wheel-test/bin/pip install "$(ls ./dist/*.whl)[uc,postgres]" pytest pytest-cov faker
          /tmp/wheel-test/bin/python -m pytest tests/
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  check-version-matches-tag:
    name: Check the tag matches version.txt
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pushed tag against version.txt
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(cat version.txt)"
          echo "tag=$TAG version.txt=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag '$TAG' does not match version.txt '$VERSION'." \
                 "version.txt is the single source of version truth -- update it," \
                 "or push a tag that matches."
            exit 1
          fi

  publish-test:
    name: Publish to TestPyPI
    needs: [build, check-version-matches-tag]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install twine
      - name: Upload to TestPyPI
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          if [ -z "$TEST_PYPI_TOKEN" ]; then
            echo "::error::TEST_PYPI_TOKEN is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi
          twine upload dist/* --repository testpypi \
            --username=__token__ --password="$TEST_PYPI_TOKEN"

  publish-prod:
    name: Publish to PyPI
    needs: publish-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Point this at a GitHub Environment with a required reviewer to gate
    # releases behind a human approval.
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install twine
      - name: Upload to PyPI
        env:
          PROD_PYPI_TOKEN: ${{ secrets.PROD_PYPI_TOKEN }}
        run: |
          if [ -z "$PROD_PYPI_TOKEN" ]; then
            echo "::error::PROD_PYPI_TOKEN is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi
          twine upload dist/* --repository pypi \
            --username=__token__ --password="$PROD_PYPI_TOKEN"
