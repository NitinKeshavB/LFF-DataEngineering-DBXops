# After a merge, writes the platform-owned records (projects, squads, domains, glossary) into platform_meta for every
# target. The metastore sink configuration lives in the platform repository's conf/ and is checked out beside this one.
name: Registry publish

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "domains.yaml"
      - "required_tags.yaml"
      - "glossary/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [dev, test, uat, preprod, prod]
    environment: ${{ matrix.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_SP_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.TEMPLATE_REPO }}
          path: template
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbxops
        env:
          DBXOPS_VERSION: ${{ vars.DBXOPS_VERSION }}
        run: python -m pip install "cookie-cutter-dbx[uc,postgres]==${DBXOPS_VERSION}"
      - name: Publish the registry
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python -m dbxops.metastore publish-registry --registry . --target "$TARGET" \
            --config template/conf/metastore.yml --git-sha "$GITHUB_SHA" --published-by "$GITHUB_ACTOR"
