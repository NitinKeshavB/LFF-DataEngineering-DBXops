resources:
  jobs:
    dataops_run:
      name: '[${var.project_id}] dataops run (${bundle.target}${var.logical_env})'
      tags:
        cost_center: ${var.cost_center}
        region: ${var.region}
        project_id: ${var.project_id}
        bundle: ${bundle.name}
        target: ${bundle.target}
        workload: ${var.workload}
        git_repo: ${bundle.git.origin_url}
        git_ref: ${bundle.git.branch}
        git_sha: ${bundle.git.commit}
      email_notifications:
        on_failure:
        - ${var.alert_email}
        on_duration_warning_threshold_exceeded:
        - ${var.alert_email}
      webhook_notifications:
        on_failure:
        - id: ${var.teams_destination_id}
        - id: ${var.email_destination_id}
        on_duration_warning_threshold_exceeded:
        - id: ${var.teams_destination_id}
      health:
        rules:
        - metric: RUN_DURATION_SECONDS
          op: GREATER_THAN
          value: ${var.duration_warning_seconds}
      performance_target: ${var.performance_target}
      queue:
        enabled: true
      environments:
      - environment_key: generate
        spec:
          client: '4'
          dependencies:
          - faker
      - environment_key: platform
        spec:
          client: '4'
          dependencies:
          - databricks-sql-connector
          - ${var.dbxops_wheel_path}
      tasks:
      - task_key: generate_data
        environment_key: generate
        spark_python_task:
          python_file: ../src/jobs/generate_data.py
          parameters:
          - --output
          - /Volumes/${var.catalog}/${var.project_id}_bronze${var.logical_env}/landing
      - task_key: bronze
        depends_on:
        - task_key: generate_data
        pipeline_task:
          pipeline_id: ${resources.pipelines.dataops_bronze.id}
      - task_key: silver
        depends_on:
        - task_key: bronze
        pipeline_task:
          pipeline_id: ${resources.pipelines.dataops_silver.id}
      - task_key: gold
        depends_on:
        - task_key: silver
        pipeline_task:
          pipeline_id: ${resources.pipelines.dataops_gold.id}
      - task_key: apply_table_tags
        depends_on:
        - task_key: gold
        environment_key: platform
        python_wheel_task:
          package_name: cookie-cutter-dbx
          entry_point: dbxops-lifecycle
          parameters:
          - reconcile
          - --target
          - ${bundle.target}
          - --config
          - ${workspace.file_path}/src/config/table_tags.yml
          - --catalog
          - ${var.catalog}
          - --var
          - logical_env=${var.logical_env}
          - --dry-run
          - ${var.table_tags_dry_run}
      - task_key: publish_run_metadata
        run_if: ALL_DONE
        environment_key: platform
        python_wheel_task:
          package_name: cookie-cutter-dbx
          entry_point: dbxops-publish-run
          parameters:
          - --run-id
          - '{{job.run_id}}'
          - --target
          - ${bundle.target}
          - --repo-id
          - ${var.project_id}
          - --config
          - ${workspace.file_path}/src/config/metastore.yml
        depends_on:
        - task_key: gold
        - task_key: apply_table_tags
