apiVersion: v3.1.0
kind: DataContract
id: dc_example_claims_bronze_party
name: party
version: 1.0.0
status: active
domain: customer__party_profile__client
dataProduct: dp_example_claims_claims_raw
description:
  purpose: Raw party change records exactly as landed by the source feed.
  usage: Input to the conformed layer only; not for analytics or reporting.
  limitations: Holds every change record (_op, _seq) including duplicates and late arrivals; schema is the source's.
servers:
- server: dev
  type: databricks
  environment: dev
  catalog: <PLACEHOLDER-dev-catalog>
  schema: example_claims_bronze
- server: test
  type: databricks
  environment: test
  catalog: <PLACEHOLDER-test-catalog>
  schema: example_claims_bronze
- server: uat
  type: databricks
  environment: uat
  catalog: <PLACEHOLDER-uat-catalog>
  schema: example_claims_bronze
- server: preprod
  type: databricks
  environment: preprod
  catalog: <PLACEHOLDER-preprod-catalog>
  schema: example_claims_bronze
- server: prod
  type: databricks
  environment: prod
  catalog: <PLACEHOLDER-prod-catalog>
  schema: example_claims_bronze
schema:
- name: party
  physicalName: <PLACEHOLDER-prod-catalog>.example_claims_bronze.party
  logicalType: object
  properties:
  - name: party_id
    logicalType: string
    physicalType: string
    required: true
  - name: first_name
    logicalType: string
    physicalType: string
    required: false
  - name: last_name
    logicalType: string
    physicalType: string
    required: false
  - name: date_of_birth
    logicalType: date
    physicalType: date
    required: false
  - name: email
    logicalType: string
    physicalType: string
    required: false
  - name: postcode
    logicalType: string
    physicalType: string
    required: false
  - name: state
    logicalType: string
    physicalType: string
    required: false
  - name: created_at
    logicalType: timestamp
    physicalType: timestamp
    required: false
  - name: _op
    logicalType: string
    physicalType: string
    required: true
  - name: _seq
    logicalType: integer
    physicalType: long
    required: true
  customProperties:
  - property: dbx.asset_id
    value: example_claims_bronze.party
  - property: dbx.spec_id
    value: bronze_party
