apiVersion: v3.1.0
kind: DataContract
id: dc_example_claims_bronze_premium
name: premium
version: 1.0.0
status: active
domain: contract_underwriting__pricing_rating__premium
dataProduct: dp_example_claims_claims_raw
description:
  purpose: Raw premium change records exactly as landed by the source feed.
  usage: Input to the conformed layer only; not for analytics or reporting.
  limitations: Holds every change record (_op, _seq) including duplicates and late arrivals; schema is the source's.
servers:
- server: dev
  type: databricks
  environment: dev
  catalog: <PLACEHOLDER-dev-catalog>
  schema: example_claims_bronze
- server: test
  type: databricks
  environment: test
  catalog: <PLACEHOLDER-test-catalog>
  schema: example_claims_bronze
- server: uat
  type: databricks
  environment: uat
  catalog: <PLACEHOLDER-uat-catalog>
  schema: example_claims_bronze
- server: preprod
  type: databricks
  environment: preprod
  catalog: <PLACEHOLDER-preprod-catalog>
  schema: example_claims_bronze
- server: prod
  type: databricks
  environment: prod
  catalog: <PLACEHOLDER-prod-catalog>
  schema: example_claims_bronze
schema:
- name: premium
  physicalName: <PLACEHOLDER-prod-catalog>.example_claims_bronze.premium
  logicalType: object
  properties:
  - name: premium_id
    logicalType: string
    physicalType: string
    required: true
  - name: policy_id
    logicalType: string
    physicalType: string
    required: true
  - name: period_start
    logicalType: date
    physicalType: date
    required: true
  - name: period_end
    logicalType: date
    physicalType: date
    required: false
  - name: written_premium
    logicalType: number
    physicalType: decimal(18,2)
    required: false
  - name: earned_premium
    logicalType: number
    physicalType: decimal(18,2)
    required: false
  - name: billed_at
    logicalType: timestamp
    physicalType: timestamp
    required: false
  - name: _op
    logicalType: string
    physicalType: string
    required: true
  - name: _seq
    logicalType: integer
    physicalType: long
    required: true
  customProperties:
  - property: dbx.asset_id
    value: example_claims_bronze.premium
  - property: dbx.spec_id
    value: bronze_premium
