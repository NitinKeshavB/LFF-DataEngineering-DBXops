apiVersion: v3.1.0
kind: DataContract
id: dc_example_claims_bronze_policy
name: policy
version: 1.0.0
status: active
domain: contract_underwriting__policy_admin_servicing__policy
dataProduct: dp_example_claims_claims_raw
description:
  purpose: Raw policy change records exactly as landed by the source feed.
  usage: Input to the conformed layer only; not for analytics or reporting.
  limitations: Holds every change record (_op, _seq) including duplicates and late arrivals; schema is the source's.
servers:
- server: dev
  type: databricks
  environment: dev
  catalog: <PLACEHOLDER-dev-catalog>
  schema: example_claims_bronze
- server: test
  type: databricks
  environment: test
  catalog: <PLACEHOLDER-test-catalog>
  schema: example_claims_bronze
- server: uat
  type: databricks
  environment: uat
  catalog: <PLACEHOLDER-uat-catalog>
  schema: example_claims_bronze
- server: preprod
  type: databricks
  environment: preprod
  catalog: <PLACEHOLDER-preprod-catalog>
  schema: example_claims_bronze
- server: prod
  type: databricks
  environment: prod
  catalog: <PLACEHOLDER-prod-catalog>
  schema: example_claims_bronze
schema:
- name: policy
  physicalName: <PLACEHOLDER-prod-catalog>.example_claims_bronze.policy
  logicalType: object
  properties:
  - name: policy_id
    logicalType: string
    physicalType: string
    required: true
    classification: internal
  - name: party_id
    logicalType: string
    physicalType: string
    required: true
    classification: internal
  - name: product
    logicalType: string
    physicalType: string
    required: false
    classification: internal
  - name: start_date
    logicalType: date
    physicalType: date
    required: false
    classification: internal
  - name: end_date
    logicalType: date
    physicalType: date
    required: false
    classification: internal
  - name: status
    logicalType: string
    physicalType: string
    required: false
    classification: internal
  - name: sum_insured
    logicalType: number
    physicalType: decimal(18,2)
    required: false
    classification: confidential
  - name: annual_premium
    logicalType: number
    physicalType: decimal(18,2)
    required: false
    classification: confidential
  - name: _op
    logicalType: string
    physicalType: string
    required: true
    classification: internal
  - name: _seq
    logicalType: integer
    physicalType: long
    required: true
    classification: internal
  customProperties:
  - property: dbx.asset_id
    value: example_claims_bronze.policy
  - property: dbx.spec_id
    value: bronze_policy
