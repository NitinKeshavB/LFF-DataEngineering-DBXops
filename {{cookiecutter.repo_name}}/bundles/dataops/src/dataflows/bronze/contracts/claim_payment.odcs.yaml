apiVersion: v3.1.0
kind: DataContract
id: dc_example_claims_bronze_claim_payment
name: claim_payment
version: 1.0.0
status: active
domain: claims__settlement_payments__claim_payment
dataProduct: dp_example_claims_claims_raw
description:
  purpose: Raw claim payment change records exactly as landed by the source feed.
  usage: Input to the conformed layer only; not for analytics or reporting.
  limitations: Holds every change record (_op, _seq) including duplicates and late arrivals; schema is the source's.
servers:
- server: dev
  type: databricks
  environment: dev
  catalog: <PLACEHOLDER-dev-catalog>
  schema: example_claims_bronze
- server: test
  type: databricks
  environment: test
  catalog: <PLACEHOLDER-test-catalog>
  schema: example_claims_bronze
- server: uat
  type: databricks
  environment: uat
  catalog: <PLACEHOLDER-uat-catalog>
  schema: example_claims_bronze
- server: preprod
  type: databricks
  environment: preprod
  catalog: <PLACEHOLDER-preprod-catalog>
  schema: example_claims_bronze
- server: prod
  type: databricks
  environment: prod
  catalog: <PLACEHOLDER-prod-catalog>
  schema: example_claims_bronze
schema:
- name: claim_payment
  physicalName: <PLACEHOLDER-prod-catalog>.example_claims_bronze.claim_payment
  logicalType: object
  properties:
  - name: payment_id
    logicalType: string
    physicalType: string
    required: true
    classification: internal
  - name: claim_id
    logicalType: string
    physicalType: string
    required: true
    classification: internal
  - name: paid_at
    logicalType: timestamp
    physicalType: timestamp
    required: false
    classification: internal
  - name: amount
    logicalType: number
    physicalType: decimal(18,2)
    required: false
    classification: confidential
  - name: payment_type
    logicalType: string
    physicalType: string
    required: false
    classification: internal
  - name: _op
    logicalType: string
    physicalType: string
    required: true
    classification: internal
  - name: _seq
    logicalType: integer
    physicalType: long
    required: true
    classification: internal
  customProperties:
  - property: dbx.asset_id
    value: example_claims_bronze.claim_payment
  - property: dbx.spec_id
    value: bronze_claim_payment
