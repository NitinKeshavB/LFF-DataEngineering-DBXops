# Validates every registration and the platform reference data on each pull request.
name: Registry validate

on:
  pull_request:
    paths:
      - "projects/**"
      - "domains.yaml"
      - "required_tags.yaml"
      - "settings.yaml"
      - "glossary/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbxops
        env:
          DBXOPS_VERSION: ${{ vars.DBXOPS_VERSION }}
        run: python -m pip install "cookie-cutter-dbx==${DBXOPS_VERSION}"
      - name: Validate registrations
        run: python -m dbxops.registry validate .
