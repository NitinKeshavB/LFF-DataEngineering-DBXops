#
# Domain taxonomy: Business Domain -> Sub-domain -> Data Domain.
# Every node is identified by its domain path: the slugs of its ancestors and itself
# joined with "__", e.g. claims__litigation__claim_litigation. Tables (ODCS contracts)
# must reference a data-domain path, so each table shows what it rolls up to.
#
# Slug rule: lowercase; drop "&" and any parenthetical; every other run of
# non-alphanumerics becomes "_". Explicit slugs below are authoritative.
# notes ending in "…" were truncated in the source document.

source: "Client domain taxonomy (email 'break down these group'), received 2026-10-10"
path_separator: "__"

