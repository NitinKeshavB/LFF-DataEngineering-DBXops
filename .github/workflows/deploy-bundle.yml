# Deploy one bundle to one target and record the deployment in the metadata database. Called by cd.yml.
#
# Authentication is Databricks workload identity federation for GitHub Actions (DATABRICKS_AUTH_TYPE=github-oidc):
# the GitHub environment for the target carries the variable DEPLOY_SP_CLIENT_ID, the application id of a
# service principal that has a federation policy for this repository. No secret is stored.
name: Deploy bundle

on:
  workflow_call:
    inputs:
      bundle:
        description: Directory name under bundles/
        required: true
        type: string
      target:
        description: dev, test, uat, preprod or prod
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}-${{ inputs.bundle }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_SP_CLIENT_ID }}
      TARGET: ${{ inputs.target }}
      BUNDLE: ${{ inputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: databricks/setup-cli@v1.20.0
      - name: Install dbxops and build tools
        run: python -m pip install ".[uc,postgres]" build
      - name: Refuse to deploy while placeholders remain
        run: make check-placeholders STRICT=1
      - name: Validate metadata
        run: make validate-metadata
      - name: Build the dbxops wheel and upload it to the platform volume
        run: |
          python -m build --wheel
          wheel="$(ls dist/*.whl)"
          catalog="$(python -c 'import dbxops, os; print(dbxops.load_environment(os.environ["TARGET"]).catalog)')"
          if [ "$TARGET" = dev ]; then folder="dev/$GITHUB_SHA"; else folder="$(tr -d '[:space:]' < version.txt)"; fi
          volume_dir="/Volumes/$catalog/platform/wheels/$folder"
          databricks fs mkdirs "dbfs:$volume_dir"
          databricks fs cp "$wheel" "dbfs:$volume_dir/$(basename "$wheel")" --overwrite
          echo "BUNDLE_VAR_dbxops_wheel_path=$volume_dir/$(basename "$wheel")" >> "$GITHUB_ENV"
      - name: Validate and deploy the bundle
        working-directory: bundles/${{ inputs.bundle }}
        run: |
          databricks bundle validate -t "$TARGET"
          databricks bundle deploy -t "$TARGET"
      - name: Record the deployment, definitions and lineage in platform_meta
        run: |
          python -m dbxops.metastore publish --target "$TARGET" --what definitions,deployments,lineage \
            --bundle-dir "bundles/$BUNDLE" --bundle "$BUNDLE" \
            --git-sha "$GITHUB_SHA" --published-by "$GITHUB_ACTOR"
